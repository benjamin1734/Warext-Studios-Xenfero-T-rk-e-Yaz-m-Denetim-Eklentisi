name: Warext Spell Check doğrulama

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warext-spell-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Doğrula ve paketle
        shell: bash
        run: bash tools/build_release.sh
      - name: Nihai paketi kaydet
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A upload release SHA256SUMS
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Warext Spell Check 1.2.0 nihai paket"
          git push
