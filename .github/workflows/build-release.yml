name: Warext Spell Check doğrulama

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Doğrula ve paketle
        shell: bash
        run: bash tools/build_release.sh
      - name: Üretilen paketi kaydet
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A release SHA256SUMS
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Warext Spell Check 1.0.0 paketini güncelle"
          git push
