name: Warext Spell Check doğrulama

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warext-spell-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Doğrula ve paketle
        shell: bash
        run: |
          set -o pipefail
          bash tools/build_release.sh 2>&1 | tee /tmp/warext-build.log
      - name: Hata tanısını kaydet
        if: failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          cp /tmp/warext-build.log BUILD_FAILURE.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_FAILURE.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Warext Spell Check 1.3.0 derleme tanısı"
          git push
      - name: Nihai paketi kaydet
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          rm -f BUILD_FAILURE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A upload release SHA256SUMS BUILD_FAILURE.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Warext Spell Check 1.3.0 nihai paket"
          git push
