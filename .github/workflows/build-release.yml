name: Warext V1 nihai doğrulama

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warext-spell-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tüm dosyaları doğrula ve V1 paketini üret
        shell: bash
        run: |
          set -o pipefail
          bash tools/build_release.sh 2>&1 | tee /tmp/warext-build.log
      - name: XenForo ACP doğrudan kurulum paketini hazırla
        if: success()
        shell: bash
        run: |
          cp release/Warext-SpellCheck-V1.zip Warext-SpellCheck-V1-XenForo-Install.zip
          cmp -s release/Warext-SpellCheck-V1.zip Warext-SpellCheck-V1-XenForo-Install.zip
          unzip -tq Warext-SpellCheck-V1-XenForo-Install.zip
      - name: V1 paketini artifact olarak yükle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Warext-SpellCheck-V1-XenForo-Install
          path: |
            Warext-SpellCheck-V1-XenForo-Install.zip
            release/Warext-SpellCheck-V1.zip
            SHA256SUMS
          if-no-files-found: error
          retention-days: 90
      - name: Hata tanısını kaydet
        if: failure() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          cp /tmp/warext-build.log BUILD_FAILURE.txt || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_FAILURE.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Warext V1 derleme tanısı"
          git push
      - name: Nihai V1 paketini main dalına kaydet
        if: success() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          rm -f BUILD_FAILURE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A upload release SHA256SUMS Warext-SpellCheck-V1-XenForo-Install.zip
          git add -u BUILD_FAILURE.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Warext Spell Check V1 XenForo kurulum paketi"
          git push
