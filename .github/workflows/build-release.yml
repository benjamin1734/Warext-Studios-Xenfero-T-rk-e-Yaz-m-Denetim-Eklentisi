name: Warext XenForo V1.0.2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warext-spell-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kaynakları doğrula
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find upload/js/warext/turkish-spellcheck -type f -name '*.js' -print0 | sort -z)
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find upload/src/addons/Warext/TurkishSpellCheck -type f -name '*.php' -print0 | sort -z)
          node tests/v110-advanced-regression.js
          node tests/longtext-regression.js
          node tests/v300-semantic-document-regression.js
          python3 - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path('upload')
          addon = json.loads((root / 'src/addons/Warext/TurkishSpellCheck/addon.json').read_text(encoding='utf-8'))
          if addon.get('version_string') != '1.0.2' or int(addon.get('version_id', 0)) != 5300072:
              raise SystemExit('Sürüm doğrulaması başarısız')
          bootstrap = (root / 'js/warext/turkish-spellcheck/bootstrap-v110.js').read_text(encoding='utf-8')
          required_assets = [
              'runtime-v240.js',
              'semantic-model-v300.js',
              'semantic-document-v300.js',
              'semantic-tuning-v301.js',
              'document-v300.js',
              'context-v230.js',
              'context-tuning-v231.js',
              'editor-v110.js',
              'longtext-v110.js'
          ]
          for asset in required_assets:
              if asset not in bootstrap:
                  raise SystemExit('Bootstrap varlığı eksik: ' + asset)
          if "const VERSION = '1.0.2';" not in bootstrap or "const ASSET_VERSION = '3002';" not in bootstrap:
              raise SystemExit('Önbellek sürüm anahtarı geçersiz')
          template = (root / 'src/addons/Warext/TurkishSpellCheck/_data/template_modifications.xml').read_text(encoding='utf-8')
          if '?wtsc=3002' not in template:
              raise SystemExit('Template önbellek kırıcı eksik')
          for path in (root / 'src/addons/Warext/TurkishSpellCheck/_data').rglob('*.xml'):
              ET.parse(path)
          PY

      - name: XenForo kurulum paketini üret
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('upload')
          target = root / 'src/addons/Warext/TurkishSpellCheck/hashes.json'
          hashes = {}
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path == target:
                  continue
              rel = path.relative_to(root).as_posix()
              hashes[rel] = hashlib.sha256(path.read_bytes()).hexdigest()
          target.write_text(json.dumps(hashes, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')
          PY
          rm -rf release
          rm -f Warext-Turkce-Yazim-Denetimi-V1-XenForo.zip Warext-Turkce-Yazim-Denetimi-V1.0.1-XenForo.zip Warext-Turkce-Yazim-Denetimi-V1.0.2-XenForo.zip
          zip -qr Warext-Turkce-Yazim-Denetimi-V1.0.2-XenForo.zip upload LICENSE
          unzip -tq Warext-Turkce-Yazim-Denetimi-V1.0.2-XenForo.zip
          python3 - <<'PY'
          import json
          import zipfile

          package = 'Warext-Turkce-Yazim-Denetimi-V1.0.2-XenForo.zip'
          required = {
              'upload/src/addons/Warext/TurkishSpellCheck/addon.json',
              'upload/src/addons/Warext/TurkishSpellCheck/hashes.json',
              'upload/src/addons/Warext/TurkishSpellCheck/Setup.php',
              'upload/js/warext/turkish-spellcheck/runtime-v240.js',
              'upload/js/warext/turkish-spellcheck/semantic-model-v300.js',
              'upload/js/warext/turkish-spellcheck/semantic-document-v300.js',
              'upload/js/warext/turkish-spellcheck/semantic-tuning-v301.js',
              'upload/js/warext/turkish-spellcheck/document-v300.js'
          }
          with zipfile.ZipFile(package) as archive:
              names = set(archive.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit('Kurulum paketinde zorunlu dosya eksik: ' + ', '.join(missing))
              addon = json.loads(archive.read('upload/src/addons/Warext/TurkishSpellCheck/addon.json').decode('utf-8'))
              if addon.get('version_string') != '1.0.2' or int(addon.get('version_id', 0)) != 5300072:
                  raise SystemExit('ZIP sürümü geçersiz')
          PY

      - name: Kurulum paketini artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: Warext-Turkce-Yazim-Denetimi-V1.0.2-XenForo
          path: Warext-Turkce-Yazim-Denetimi-V1.0.2-XenForo.zip
          if-no-files-found: error
          retention-days: 90

      - name: Paketi main dalına kaydet
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          rm -f SHA256SUMS Warext-SpellCheck-V1-XenForo-Install.zip README.txt CHANGELOG.md THIRD_PARTY.md BUILD_FAILURE.txt Warext-Turkce-Yazim-Denetimi-V1-XenForo.zip Warext-Turkce-Yazim-Denetimi-V1.0.1-XenForo.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "V1.0.2"
          git push
