name: Eklentiyi derle

on:
  push:
    branches:
      - main
    paths:
      - source/dictionary/**
      - tools/**
      - tests/**
      - upload/js/warext/turkish-spellcheck/**
      - upload/src/addons/Warext/TurkishSpellCheck/**
      - .github/workflows/build-release.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Eklentiyi derle ve doğrula
        shell: bash
        run: bash tools/build_release.sh

      - name: Üretilen dosyaları kaydet
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upload/js/warext/turkish-spellcheck/dictionary-v160.js
          git add upload/src/addons/Warext/TurkishSpellCheck/Resources/LICENSE-MPL-2.0.txt
          git add release/Warext-SpellCheck-1.zip SHA256SUMS
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Derlenmiş eklenti paketini güncelle"
          git push
