name: Warext XenForo V1

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warext-spell-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derleme uyumluluk dosyalarını hazırla
        shell: bash
        run: |
          printf '%s\n' 'Warext Turkish Spell Check V1' > README.txt
          printf '%s\n' '# V1' > CHANGELOG.md
          printf '%s\n' 'Üçüncü taraf lisans ve atıfları upload/src/addons/Warext/TurkishSpellCheck/Resources altında paketlenir.' > THIRD_PARTY.md

      - name: Eklentiyi doğrula
        shell: bash
        run: |
          set -o pipefail
          bash tools/build_release.sh 2>&1 | tee /tmp/warext-build.log

      - name: XenForo doğrudan kurulum paketini üret
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('upload')
          target = root / 'src/addons/Warext/TurkishSpellCheck/hashes.json'
          hashes = {}
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path == target:
                  continue
              rel = path.relative_to(root).as_posix()
              hashes[rel] = hashlib.sha256(path.read_bytes()).hexdigest()
          target.write_text(json.dumps(hashes, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')
          PY
          rm -f Warext-Turkce-Yazim-Denetimi-V1-XenForo.zip
          zip -qr Warext-Turkce-Yazim-Denetimi-V1-XenForo.zip upload LICENSE
          unzip -tq Warext-Turkce-Yazim-Denetimi-V1-XenForo.zip
          python3 - <<'PY'
          import zipfile

          package = 'Warext-Turkce-Yazim-Denetimi-V1-XenForo.zip'
          required = {
              'upload/src/addons/Warext/TurkishSpellCheck/addon.json',
              'upload/src/addons/Warext/TurkishSpellCheck/hashes.json',
              'upload/src/addons/Warext/TurkishSpellCheck/Setup.php'
          }
          with zipfile.ZipFile(package) as archive:
              names = set(archive.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit('Kurulum paketinde zorunlu dosya eksik: ' + ', '.join(missing))
          PY

      - name: Kurulum paketini artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: Warext-Turkce-Yazim-Denetimi-V1-XenForo
          path: Warext-Turkce-Yazim-Denetimi-V1-XenForo.zip
          if-no-files-found: error
          retention-days: 90

      - name: Nihai paketi main dalına kaydet
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          rm -rf release
          rm -f SHA256SUMS Warext-SpellCheck-V1-XenForo-Install.zip README.txt CHANGELOG.md THIRD_PARTY.md BUILD_FAILURE.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "XenForo doğrudan kurulum paketini güncelle"
          git push
