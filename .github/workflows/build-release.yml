name: Warext Spell Check paketleme

on:
  push:
    branches:
      - main
    paths:
      - RELEASE_TRIGGER
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Doğrula ve paketle
        shell: bash
        run: bash tools/build_release.sh
      - name: Paketi kaydet
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A release SHA256SUMS
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Warext Spell Check 1.0.0 nihai paket"
          git push
