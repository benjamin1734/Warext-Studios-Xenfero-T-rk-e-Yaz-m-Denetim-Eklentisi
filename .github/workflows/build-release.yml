name: Warext XenForo V1.0.3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: warext-spell-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Yerel motoru doğrula ve XenForo paketini üret
        shell: bash
        run: bash tools/build_release.sh

      - name: Kurulum paketini artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: Warext-Turkce-Yazim-Denetimi-V1.0.3-XenForo
          path: Warext-Turkce-Yazim-Denetimi-V1.0.3-XenForo.zip
          if-no-files-found: error
          retention-days: 90

      - name: Doğrulanmış paketi main dalına kaydet
        if: success() && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "V1.0.3 paketini güncelle"
          git push
